<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopHub – Order Confirmed</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="container"><div id="root" class="confirm"></div></main>
  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async () => {
      const root = $('#root');
      if (!Auth.loggedIn) return (location.href = 'login.html');
      const id = new URLSearchParams(location.search).get('id');
      try {
        const { order } = await api('/orders/' + encodeURIComponent(id), { auth: true });
        root.innerHTML = `
          <div class="check">✓</div>
          <h1>Thank you for your order!</h1>
          <p style="color:var(--muted)">Order <strong>#${order._id.slice(-8).toUpperCase()}</strong> has been placed on ${new Date(order.orderDate).toLocaleString()}.</p>
          <div class="panel">
            ${order.products.map((p) => `<div class="order-line"><span>${esc(p.name)} × ${p.quantity}</span><strong>${money(p.price * p.quantity)}</strong></div>`).join('')}
            <div class="summary-row total"><span>Total</span><span>${money(order.totalAmount)}</span></div>
            <p style="margin-top:0.8rem"><strong>Ship to:</strong> ${esc(order.shippingAddress)}</p>
            <p><strong>Status:</strong> <span class="status ${esc(order.status)}">${esc(order.status)}</span></p>
          </div>
          <a class="btn btn-primary" href="orders.html">View my orders</a>
          <a class="btn btn-outline" href="products.html">Continue shopping</a>`;
      } catch (e) {
        root.innerHTML = `<div class="empty"><div class="big">😕</div><h2>${esc(e.message)}</h2><a class="btn btn-primary" href="orders.html">My orders</a></div>`;
      }
    })();
  </script>
</body>
</html>
